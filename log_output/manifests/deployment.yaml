apiVersion: apps/v1
kind: Deployment
metadata: 
  name: log-output

spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: image-claim
      containers:
        - name: log-generator
          image: log-output-generator:1.10
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: shared-data
              mountPath: /shared
        - name: log-reader
          image: log-output-reader:1.11
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          volumeMounts:
            - name: shared-data
              mountPath: /shared