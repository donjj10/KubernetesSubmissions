apiVersion: apps/v1
kind: Deployment
metadata: 
  name: log-output
  namespace: exercises

spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: log-generator
          image: log-output-generator:1.10
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: shared-data
              mountPath: /shared
        - name: log-reader
          image: log-output-reader:2.8
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: shared-data
              mountPath: /shared
            - name: config-volume
              mountPath: /config

      volumes:
        - name: shared-data
          emptyDir: {}
        - name: config-volume
          configMap:
            name: log-output-config