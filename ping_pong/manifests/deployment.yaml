apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: image-claim
      containers:
      - name: ping-pong-container
        image: ping-pong:1.11
        imagePullPolicy: Never
        volumeMounts:
        - name: shared-data
          mountPath: /shared
        env:
        - name: PORT
          value: "3000"
        ports:
        - containerPort: 3000

        